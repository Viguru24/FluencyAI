<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0369a1" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" filter="url(#dropShadow)" />
  
  <!-- Subtle Inner Specular Glow -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#glowGrad)" stroke="rgba(255,255,255,0.4)" stroke-width="4" />

  <!-- Speech Bubble with Voice Immersion Waves -->
  <g transform="translate(100, 100)">
    <!-- Speech bubble body -->
    <path d="M40 40 C 40 18, 58 0, 80 0 L 232 0 C 254 0, 272 18, 272 40 L 272 170 C 272 192, 254 210, 232 210 L 100 210 L 40 260 L 52 210 C 46 205, 40 190, 40 170 Z" 
          fill="#ffffff" 
          filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.12))" />

    <!-- AI Sparkle / Star on top right of bubble -->
    <path d="M 248 10 Q 256 30 276 38 Q 256 46 248 66 Q 240 46 220 38 Q 240 30 248 10 Z" fill="#fbbf24" />

    <!-- Audio Waves Inside Bubble (Vocal Fluency Theme) -->
    <!-- Bar 1 -->
    <rect x="96" y="90" width="12" height="36" rx="6" fill="#0ea5e9" />
    <!-- Bar 2 -->
    <rect x="120" y="65" width="12" height="86" rx="6" fill="#0284c7" />
    <!-- Bar 3 (Peak Fluency) -->
    <rect x="144" y="45" width="12" height="126" rx="6" fill="#10b981" />
    <!-- Bar 4 -->
    <rect x="168" y="70" width="12" height="76" rx="6" fill="#0ea5e9" />
    <!-- Bar 5 -->
    <rect x="192" y="95" width="12" height="26" rx="6" fill="#38bdf8" />

    <!-- Friendly Letter 'A' Sub-badge in corner representing English Language -->
    <circle cx="218" cy="180" r="24" fill="#f0f9ff" stroke="#bae6fd" stroke-width="3" />
    <text x="218" y="188" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="800" fill="#0369a1" text-anchor="middle">A</text>
  </g>
</svg>
