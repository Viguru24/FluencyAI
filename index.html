<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Fluency AI - AI English Language Tutor</title>
    
    <!-- Meta tags for PWA & Mobile Web Apps -->
    <meta name="description" content="AI-powered English language tutoring platform with interactive voice roleplays, daily fluency goals, and pronunciation coaching." />
    <meta name="theme-color" content="#0ea5e9" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Fluency AI" />
    <meta name="application-name" content="Fluency AI" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Open Graph & Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fluency AI" />
    <meta property="og:title" content="Fluency AI - AI English Language Tutor" />
    <meta property="og:description" content="AI-powered English language tutoring platform with interactive voice roleplays, daily fluency goals, and pronunciation coaching." />
    <meta property="og:image" content="./logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fluency AI - AI English Language Tutor" />
    <meta name="twitter:description" content="AI-powered English language tutoring platform with interactive voice roleplays, daily fluency goals, and pronunciation coaching." />
    <meta name="twitter:image" content="./logo.png" />

    <!-- Icons and Manifest -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=11" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png?v=11" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png?v=11" />
    <link rel="shortcut icon" href="./favicon.ico?v=11" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=11" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=11" />
    <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png?v=11" />
    <link rel="apple-touch-icon" sizes="512x512" href="./icon-512.png?v=11" />
    <link rel="manifest" href="./manifest.json?v=11" />

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Instant Dark/Light Theme Initializer to prevent white flash -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('fluency_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#090d16');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-brand-200 selection:text-brand-900 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
